<div id="pedido" class="border rounded p-4 mb-4">
    <h2>Realizar pedido</h2>
    <p>Rellena los siguientes datos.</p>

    <form [formGroup]="orderForm" (ngSubmit)="sendOrder()">
        <div class="mb-3">
            <label for="pizza" class="form-label">Pizza</label>
            <select class="form-select" id="pizza" formControlName="pizza">
                <option value="" selected>Selecciona una pizza</option>
                @for (pizza of pizzas; track $index) {
                    <option>
                        {{ pizza }}
                    </option>
                }
            </select>
        </div>

        <div class="mb-3">
            <label for="nombre" class="form-label">Nombre</label>
            <input type="text" class="form-control" id="nombre" formControlName="nombre"
                placeholder="Escribe tu nombre">
        </div>
        <div class="form-check">
            <input class="form-check-input" type="radio" name="radioDisabled" id="radioDisabled" disabled>
            <label class="form-check-label" for="radioDisabled">
                Disabled radio
            </label>
        </div>
        <div class="form-check">
            <input class="form-check-input" type="radio" name="radioDisabled" id="radioCheckedDisabled" checked
                disabled>
            <label class="form-check-label" for="radioCheckedDisabled">
                Disabled checked radio
            </label>
        </div>
        <div class="mb-3">
            <label for="telefono" class="form-label">Teléfono</label>
            <input type="tel" class="form-control" id="telefono" formControlName="telefono"
                placeholder="Escribe tu teléfono">
        </div>

        <div class="form-check mb-3">
            <input type="checkbox" class="form-check-input" id="confirmar" formControlName="confirmar">
            <label class="form-check-label" for="confirmar">
                Confirmar los datos
            </label>
        </div>

        <button type="submit" class="btn btn-secondary">
            Enviar pedido
        </button>
    </form>
</div>
